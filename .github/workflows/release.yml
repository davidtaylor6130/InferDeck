name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build only — skip publishing the GitHub Release'
        type: boolean
        default: true

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Ensure Vulkan SDK
        shell: pwsh
        run: |
          # Use whatever version the runner already has (VS2026 image ships with one)
          $sdkRoot = "C:\VulkanSDK"
          $existing = if (Test-Path $sdkRoot) {
            Get-ChildItem $sdkRoot -Directory | Sort-Object Name -Descending | Select-Object -First 1
          }

          if ($existing) {
            Write-Host "Using pre-installed Vulkan SDK: $($existing.FullName)"
            echo "VULKAN_SDK=$($existing.FullName)" >> $env:GITHUB_ENV
          } else {
            Write-Host "Vulkan SDK not found — installing via Chocolatey..."
            choco install vulkan-sdk -y --no-progress
            $installed = Get-ChildItem $sdkRoot -Directory | Sort-Object Name -Descending | Select-Object -First 1
            Write-Host "Installed: $($installed.FullName)"
            echo "VULKAN_SDK=$($installed.FullName)" >> $env:GITHUB_ENV
          }

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        id: vcpkg-cache
        with:
          path: ${{ github.workspace }}/build/vcpkg_installed
          key: vcpkg-x64-windows-${{ hashFiles('vcpkg.json') }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Build dashboard
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter dashboard test
          pnpm test:openai-contract
          pnpm --filter dashboard build

      - name: Provision Whisper runtime source
        shell: pwsh
        run: .\scripts\setup-whisper-runtime.ps1 -RuntimeRoot runtime -SkipModel

      - name: Select Visual Studio generator
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $version = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationVersion
          if (!$version) { throw "Visual Studio with MSBuild is unavailable" }
          $generator = if ($version.StartsWith("18.")) { "Visual Studio 18 2026" } else { "Visual Studio 17 2022" }
          "CMAKE_VS_GENERATOR=$generator" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure
        run: |
          cmake -S . -B build `
            -G "$env:CMAKE_VS_GENERATOR" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DINFERDECK_BUILD_TESTS=ON `
            -DINFERDECK_REQUIRE_WHISPER_CPP=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure -L "unit|integration"

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null

          # Main executable
          Copy-Item build\bin\Release\inferdeck-gateway.exe dist\

          # Dashboard static assets (copied post-build by CMake)
          Copy-Item -Recurse build\bin\Release\static dist\
          New-Item -ItemType Directory -Path dist\config\templates, dist\data, dist\ops -Force | Out-Null
          Copy-Item config\gateway.yml dist\config\
          Copy-Item config\templates\* dist\config\templates\
          Copy-Item data\pricing.json dist\data\
          Copy-Item ops\*.ps1 dist\ops\

          # llama.cpp + ggml DLLs built from source (live alongside the exe)
          Copy-Item build\bin\Release\*.dll dist\

          # vcpkg runtime DLLs (x64-windows is a dynamic triplet) — already
          # included above since vcpkg copies them to bin\Release\ on Windows,
          # but copy from vcpkg_installed as a fallback in case any are missing.
          $vcpkgBin = "build\vcpkg_installed\x64-windows\bin"
          if (Test-Path $vcpkgBin) {
            Copy-Item "$vcpkgBin\*.dll" dist\ -ErrorAction SilentlyContinue
          }

          Write-Host "=== dist contents ==="
          Get-ChildItem dist -Recurse | Select-Object FullName

      - name: Package
        run: Compress-Archive -Path dist\* -DestinationPath InferDeck-Windows.zip

      - name: Upload artifact (always, for inspection)
        uses: actions/upload-artifact@v4
        with:
          name: InferDeck-Windows
          path: InferDeck-Windows.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && github.event.inputs.dry_run != 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: InferDeck-Windows.zip
          generate_release_notes: true
