# Merge this entry into model_registry after obtaining the matching LTX-2.3 artifacts.
# The admission estimate is conservative, not a measured fit guarantee.
model_registry:
  - name: ltx-2.3
    family: ltx
    runtime: ltx_video_cpp
    modality: video
    role: media
    compute: vulkan_gpu
    residency: on_demand
    admission_pool: video
    memory_required_mb: 30000
    eviction_eligible: true
    capabilities: [video_generation]
    n_slots: 1
    min_slots: 1
    concurrency_limit: 1
    vram_required_mb: 30000
    artifacts:
      diffusion_model: models/ltx-2.3/ltx-2.3-22b-dev-UD-Q4_K_M.gguf
      llm: models/ltx-2.3/gemma-3-12b-it-qat-UD-Q4_K_XL.gguf
      embeddings_connectors: models/ltx-2.3/text_encoders/ltx-2.3-22b-dev_embeddings_connectors.safetensors
      vae: models/ltx-2.3/vae/ltx-2.3-22b-dev_video_vae.safetensors
      audio_vae: models/ltx-2.3/vae/ltx-2.3-22b-dev_audio_vae.safetensors
      backend: diffusion=vulkan0,te=cpu
