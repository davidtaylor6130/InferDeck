    gguf_path: "C:/Inferdeck/models/lmstudio-community/Qwen3.6-35B-A3B-GGUF/Qwen3.6-35B-A3B-Q4_K_M.gguf"
    mmproj_path: ""
    n_slots: 2
    vram_required_mb: 24000
    context_size: 100096
    has_vision: false
    # Corrected Qwen3.6 chat template: avoids the "No user query found in messages."
    # crash during multi-step tool calling (e.g. OpenCode). See config/templates/.
    chat_template_path: "C:/Inferdeck/config/templates/qwen3.6-fixed.jinja"
    # Qwen3 thinking/reasoning sweet spot (Qwen team).
    sampling:
      temperature: 0.6
      top_p: 0.95
      top_k: 20
      min_p: 0.0
      repeat_penalty: 1.0

  - name: "qwen3-coder-30b-a3b"
    family: "qwen3.6"
    gguf_path: "C:/Inferdeck/models/DevQuasar/Qwen.Qwen3-Coder-30B-A3B-Instruct-GGUF/Qwen.Qwen3-Coder-30B-A3B-Instruct.Q4_K_M.gguf"
    mmproj_path: ""
    n_slots: 1
    vram_required_mb: 20000
    context_size: 262144
    has_vision: false
    # Qwen3-Coder recommended sampling (Qwen team): temp 0.7, top_p 0.8,
