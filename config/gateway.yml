server:
  # Home-lab contract: accept connections on LAN and overlay-network interfaces.
  # Covered by the automated [config][lan] regression test.
  host: "0.0.0.0"
  port: 11434

logging:
  level: "info"
  file: "logs/gateway.log"

auth:
  required: false
  token: ""

control:
  allow_remote: false
  allow_data_plane_token: false
  token: ""
  origins:
    - "http://127.0.0.1:11434"
    - "http://localhost:11434"
    - "http://[::1]:11434"

cors:
  origins:
    - "*"

state:
  file: "~/.inferdeck/state.json"

model_store:
  root: "models/store"
  archive_root: "models/archive"
  hf_token: ""

default_model: "qwen3.8-27b"

observability:
  # Keep lifetime usage independent of the Windows service account and cwd.
  stats_db: "C:/InferDeck/data/stats.db"
  adlx_helper: ""
  telemetry_poll_ms: 100

gateway:
  auto_swap: true
  n_batch: 2048
  n_ubatch: 2048
  use_mmap: false
  use_mlock: false
  n_gpu_layers: null
  flash_attn: "auto"
  kv_offload: true
  op_offload: true
  cache_type_k: "q4_0"
  cache_type_v: "q8_0"
  swa_full: false
  truncate_prompt: true
  voice_session_grace_ms: 15000

  # Server-side sampler defaults (issue #42). These mirror stock llama-server:
  # DRY off and repeat_penalty neutral, so reasoning models (Qwen3 / Qwen3.6)
  # stay coherent. Explicit per-request (OpenAI body) values still override
  # these. Can be overridden per entry under model_registry below.
  sampling:
    temperature: 0.8
    top_p: 0.95
    top_k: 40
    min_p: 0.05
    repeat_penalty: 1.0      # 1.0 = disabled (llama-server default)
    repeat_last_n: 64
    dry_multiplier: 0.0      # 0.0 = disabled (llama-server default)
    dry_base: 1.75
    dry_allowed_length: 2
    dry_penalty_last_n: -1   # -1 = context size
    dry_seq_breakers: ["\n", ":", "\"", "*"]

# Map Anthropic model names to local models so Anthropic-API clients
# (e.g. Claude Code) route to the right local model. Unmapped names fall back
# to the loaded model, then default_model. Keys must be the exact model IDs the
# client sends. Unmapped non-empty model IDs are rejected instead of silently
# switching to a different local model.
anthropic:
  model_aliases:
    claude-opus-4-8: "qwen3.6-27b"
    claude-opus-4-7: "qwen3.6-27b"
    claude-opus-4-6: "qwen3.6-27b"
    claude-fable-5: "qwen3-coder-next"
    claude-sonnet-4-6: "qwen3.6-35b-a3b"
    claude-sonnet-4-5: "qwen3.6-35b-a3b"
    claude-haiku-4-5: "gpt-oss-20b"
    claude-haiku-4-5-20251001: "gpt-oss-20b"

model_aliases: []

model_registry:
  - name: "supertonic-3"
    family: "supertonic"
    runtime: "sherpa_onnx"
    modality: "audio_speech"
    capabilities:
      - "audio_speech"
    n_slots: 1
    min_slots: 1
    vram_required_mb: 0
    artifacts:
      engine: "supertonic"
      duration_predictor: "C:/InferDeck/models/tts/supertonic-3/duration_predictor.int8.onnx"
      text_encoder: "C:/InferDeck/models/tts/supertonic-3/text_encoder.int8.onnx"
      vector_estimator: "C:/InferDeck/models/tts/supertonic-3/vector_estimator.int8.onnx"
      vocoder: "C:/InferDeck/models/tts/supertonic-3/vocoder.int8.onnx"
      tts_json: "C:/InferDeck/models/tts/supertonic-3/tts.json"
      unicode_indexer: "C:/InferDeck/models/tts/supertonic-3/unicode_indexer.bin"
      voice_style: "C:/InferDeck/models/tts/supertonic-3/voice.bin"
      provider: "cpu"
      num_threads: "4"

  - name: "parakeet-tdt-0.6b-v3"
    family: "parakeet"
    runtime: "sherpa_onnx"
    modality: "audio_transcription"
    capabilities:
      - "audio_transcription"
    n_slots: 1
    min_slots: 1
    vram_required_mb: 0
    artifacts:
      encoder: "C:/InferDeck/models/stt/parakeet-tdt-0.6b-v3/encoder.int8.onnx"
      decoder: "C:/InferDeck/models/stt/parakeet-tdt-0.6b-v3/decoder.int8.onnx"
      joiner: "C:/InferDeck/models/stt/parakeet-tdt-0.6b-v3/joiner.int8.onnx"
      tokens: "C:/InferDeck/models/stt/parakeet-tdt-0.6b-v3/tokens.txt"
      model_type: "nemo_transducer"
      provider: "cpu"
      num_threads: "4"

  - name: "whisper-base-en"
    family: "whisper"
    runtime: "whisper_cpp"
    modality: "audio_transcription"
    capabilities:
      - "audio_transcription"
    n_slots: 1
    min_slots: 1
    vram_required_mb: 0
    artifacts:
      model: "E:/InferDeck/models/stt/whisper/ggml-base.en.bin"
      provider: "cpu"
      num_threads: "4"

  - name: "qwen3.8-27b"
    family: "qwen3.8"
    gguf_path: "E:/InferDeck/models/unsloth/Qwen3.8-27B-GGUF/Qwen3.8-27B-Q4_K_M.gguf"
    mmproj_path: "E:/InferDeck/models/unsloth/Qwen3.8-27B-GGUF/mmproj-F16.gguf"
    n_slots: 4
    min_slots: 4
    vram_required_mb: 30000
    context_size: 100000
    n_batch: 2048
    n_ubatch: 2048
    cache_type_k: "q4_0"
    cache_type_v: "q4_0"
    reasoning:
      supported: true
      efforts: [low, medium, xhigh]
      default: xhigh
      none_disables: true
      aliases:
        high: xhigh
    speculative:
      type: "mtp"
      draft_tokens: 2
      p_min: 0.0
      max_active_requests: 1
    has_vision: true
    sampling:
      temperature: 1.0
      top_p: 0.95
      top_k: 20
      min_p: 0.0
      repeat_penalty: 1.0

  - name: "qwen3.6-27b"
    family: "qwen3.6"
    gguf_path: "E:/InferDeck/models/unsloth/Qwen3.6-27B-MTP-GGUF/Qwen3.6-27B-Q4_K_M.gguf"
    mmproj_path: "C:/Inferdeck/models/unsloth/Qwen3.6-27B-GGUF/mmproj-BF16.gguf"
    n_slots: 4
    min_slots: 4
    vram_required_mb: 29791
    context_size: 100000
    n_batch: 2048
    n_ubatch: 2048
    cache_type_k: "q4_0"
    cache_type_v: "q4_0"
    speculative:
      type: "mtp"
      draft_tokens: 2
      p_min: 0.0
      max_active_requests: 1
    optimization:
      status: "measured"
      measured_at: "2026-07-26"
      quality_passes: 3
      quality_total: 3
      single_tokens_per_second: 50.16
      parallel_tokens_per_second: 51.24
      schedule:
        enabled: false
        window_start: "03:00"
        window_end: "04:00"
    has_vision: false
    # Corrected Qwen3.6 chat template: avoids the "No user query found in messages."
    # crash during multi-step tool calling (e.g. OpenCode). See config/templates/.
    chat_template_path: "C:/Inferdeck/config/templates/qwen3.6-fixed.jinja"
    # Per-model sampler overrides inherit the global `gateway.sampling` block
    # above and override only the keys listed here (issue #42).
    # Qwen3 thinking/reasoning sweet spot (Qwen team): temp 0.6, top_p 0.95,
    # top_k 20, min_p 0, no repetition penalty / no DRY.
    sampling:
      temperature: 0.6
      top_p: 0.95
      top_k: 20
      min_p: 0.0
      repeat_penalty: 1.0

  - name: "qwen3.6-35b-a3b"
