[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "inferdeck-forced-aligner"
version = "1.0.11"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.116.1",
  "huggingface-hub==0.34.4",
  "imageio-ffmpeg==0.6.0",
  "python-multipart==0.0.20",
  "qwen-asr==0.0.6",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
]

[project.scripts]
inferdeck-forced-aligner = "inferdeck_forced_aligner.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
